<!DOCTYPE html>
<html>
    <head>
        <title>ViewMyPlans</title>
        <link href="/css/page-style.css" rel="stylesheet"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="icon" type="image/jpg" href="/images/logo.jpg">
        <link href="https://fonts.googleapis.com/css2?family=Freeman&family=Satisfy&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="title-bar">Current Projects</div>
        <div class="category-bar">
            <div class="tab-bar">
            </div>
        </div>

        <div style="display: flex; align-content: center; padding: 10px;">
            <input placeholder="search..." type="text" id="search-bar">
        </div>

        <div class="header-board">
            <div class="header-card">
                <table>
                    <tr>
                        <th class="name-col">Proj Name</th>
                        <th class="contractor-col">Contractor(s)</th>
                        <th class="bid-col">Bid Date</th>
                        <th class="version-col">Version</th>
                        <th class="preview-col">Preview</th>
                        <th class="access-col">Access Level</th>
                    </tr>
                </table>
                <a style="padding: 5px; color: rgba(0,0,0,0);" href="#">Order<br>Plans</a>
            </div>
        </div>
        
        <div id="plan-board" class="plan-board">
            <!--
            <div class="plan-card">
                <table>
                    <tr>
                        <td class="name-col">Project 1</td>
                        <td class="contractor-col">Contractor 1</td>
                        <td class="bid-col">05/08/2024</td>
                        <td class="version-col">100% Construction</td>
                        <td class="preview-col"><a href="#">online set</a></td>
                        <td class="access-col"><a href="#">Newforma</a></td>
                    </tr>
                </table>
                <a class="order-button" href="#">Order<br>Plans</a>
            </div>
            -->
        </div>
    </body>
    <script>
        let tab_bar = document.getElementsByClassName("tab-bar")[0];
        let board = document.getElementById("plan-board");
        let search_bar = document.getElementById("search-bar");
        let tabs = []
        var category = 0;
        let categories = [];
        let plans = [];
        var match_phrase = "";

        search_bar.addEventListener("input", (e) => {
            console.log("phrase change")
            match_phrase = e.target.value;
            populate_list();
        })

        function populate_list() {
            let cards = document.getElementsByClassName("plan-card");
            while (cards.length > 0)
                cards[0].remove();

	        for (let i = plans.length - 1; i >= 0; i--) {
            	let plan = plans[i];

                if (plan.name.toUpperCase().includes(match_phrase.toUpperCase()) == false){
                    continue;
                }

                var preview_link = `<a href='${plan.preview}'>preview</a>`;
                if (plan.preview == "#") {
                    preview_link = 'NA';
                }

                let access_level = (Boolean(plan.is_public)) ? "Public Project" : "Private Project";
                var access_link = `<a href='${plan.link}'>${access_level}</a>`;
                if (plan.link == 'NA') {
                    access_link = '<a href="https://servius.tech/contact">Contact Us</a>';
                }

                var contractors = plan.contractor;
                contractors = contractors.replace(" ", "");
                contractors = contractors.replace(",", "<br>");

                let card = document.createElement("div");
                card.className = "plan-card";
                card.innerHTML = `
                    <table>
                        <tr>
                            <td class="name-col">${plan.name}</td>
                            <td class="contractor-col">${contractors}</td>
                            <td class="bid-col">${plan.bid_date}</td>
                            <td class="version-col">${plan.version}</td>
	   		                <td class="preview-col">${preview_link}</td>
                            <td class="access-col">${access_link}</td>
                        </tr>
                    </table>
                    <a class="order-button" href="/order?id=${plan.id}&cat=${category}">Order<br>Plans</a>
                `;

                board.appendChild(card);
            }
        }

        function retrieve_plans() {
            let cat_name = categories[category];
            // Fetch plans
            let config = {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "mode": "same-origin",
                }
            }

            fetch(`/get-projects?category=${cat_name}`, config)
            .then((response) => response.json())
            .then((res) => {
                let data = res;
                plans = data.plans;
                populate_list();
            })
        }

        function set_active_tab() {
            for (let i = 0; i < tabs.length; i++) {
                if (tabs[i].id == category) {
                    tabs[i].className = "tab active";
                }
                else {
                    tabs[i].className = "tab";
                }
            }
        }
        let config = {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
				"mode": "same-origin",
			},
        };
        fetch("/categories", config)
        .then((response) => response.json())
        .then((res) => {
            for (cat_index in res.categories) {
                categories.push(res.categories[cat_index]);

                let tab = document.createElement("a");
                tab.href = "#";
                tab.className = "tab";
                tab.id = cat_index;
                tab.innerText = res.categories[cat_index];

                tab.addEventListener("click", (e) => {
                    e.preventDefault();

                    category = e.target.id;
                    set_active_tab();
                    retrieve_plans();
                });

                tab_bar.appendChild(tab);

                tabs.push(tab);
            }
            set_active_tab();
            retrieve_plans();
        })
    </script>
</html>
