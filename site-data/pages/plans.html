<!DOCTYPE html>
<html>
    <head>
        <title>ViewMyPlans</title>
        <link href="/css/page-style.css" rel="stylesheet"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="icon" type="image/jpg" href="/images/logo.jpg">
        <link href="https://fonts.googleapis.com/css2?family=Freeman&family=Satisfy&display=swap" rel="stylesheet">
    </head>
    <body>
        <p style="display: flex; align-content: center; transform: translateY(20pt);">
            <a style="text-decoration: underline; margin-left: auto; margin-right: auto;" href="/">Home</a>
            <a style="text-decoration: underline; margin-left: auto; margin-right: auto;" href="https://semblueinc.com">Semblueinc</a>
        </p>
        <div class="title-bar">Current Projects</div>
        <div class="category-bar">
            <div class="tab-bar">
            </div>
        </div>

        <div style="display: flex; align-content: center; padding: 10px;">
            <p style="margin-left: auto; margin-right: 10px;">Search:</p>
            <input placeholder="name, contractor, bid date, version..." type="text" id="search-bar">
        </div>

        <p style="font-size: 8pt; margin: 0; width: 100%; text-align: center;">Click field header to sort listings by value.</p>
        <div class="header-board">
            <div class="header-card">
                <table>
                    <tr>
                        <th class="name-col"><a id="name" class="field_label" href="#">Proj Name</a></th>
                        <th class="contractor-col"><a id="contractor" class="field_label" href="#">Contractor(s)</a></th>
                        <th class="bid-col"><a id="bid_date" class="field_label" href="#">Bid Date</a></th>
                        <th class="version-col"><a id="version" class="field_label" href="#">Version</a></th>
                        <th class="preview-col">Preview</th>
                        <th class="access-col">Access Level</th>
                    </tr>
                </table>
                <a style="padding: 5px; color: rgba(0,0,0,0);" href="#">Order<br>Plans</a>
            </div>
        </div>
        
        <div id="plan-board" class="plan-board">
            <!--
            <div class="plan-card">
                <table>
                    <tr>
                        <td class="name-col">Project 1</td>
                        <td class="contractor-col">Contractor 1</td>
                        <td class="bid-col">05/08/2024</td>
                        <td class="version-col">100% Construction</td>
                        <td class="preview-col"><a href="#">online set</a></td>
                        <td class="access-col"><a href="#">Newforma</a></td>
                    </tr>
                </table>
                <a class="order-button" href="#">Order<br>Plans</a>
            </div>
            -->
        </div>
    </body>
    <script>
        let tab_bar = document.getElementsByClassName("tab-bar")[0];
        let board = document.getElementById("plan-board");
        let search_bar = document.getElementById("search-bar");
        let field_labels = document.getElementsByClassName("field_label");
        
        var sort_field = "name";
        var sort_flip = false;

        var no_projects_card = undefined;
        let tabs = []
        var category = 0;
        var saved_category = -1;
        let categories = [];
        let plans = [];
        var match_phrase = "";

        let field_label_names = {
            "name": "Proj Name",
            "contractor": "Contractor(s)",
            "bid_date": "Bid Date",
            "version": "Version"
        };


        search_bar.addEventListener("input", (e) => {
            match_phrase = e.target.value;


            if (match_phrase.length > 0 && category != -1) {
                saved_category = category;
                category = -1;
                set_active_tab();
                retrieve_plans();
            }
            else if (match_phrase.length == 0 && category == -1) {
                category = saved_category;
                saved_category = -1;
                set_active_tab();
                retrieve_plans();
            }

            populate_list();
        })
        
        function keyword_match_check(plan) {
            let keyword = match_phrase.toUpperCase();
            
            let name = plan.name.toUpperCase();
            let contractor = plan.contractor.toUpperCase();
            let version = plan.version.toUpperCase();
            let bid_date = plan.bid_date;

            let name_match = name.includes(keyword);
            let contractor_match = contractor.includes(keyword);
            let version_match = version.includes(keyword);
            let bid_date_match = bid_date.includes(keyword);

            return name_match || contractor_match || version_match || bid_date_match;
        }

        function populate_list() {
            let cards = document.getElementsByClassName("plan-card");
            while (cards.length > 0)
                cards[0].remove();

            if (no_projects_card != undefined){
                no_projects_card.remove();
                no_projects_card = undefined;
            }

	        for (let i = 0; i < plans.length; i++) {
            	let plan = plans[i];

                if (keyword_match_check(plan) == false){
                    continue;
                }

                let file_name = plan.preview.substring(14)
                
                var preview_link = `<a href='/get-preview?file=${file_name}' target="_blank">preview</a>`;
                if (plan.preview == "#") {
                    preview_link = 'NA';
                }

                let access_level = (plan.is_public == "Yes") ? "Public Project" : "Private Project";
                var access_link = `<a href='${plan.link}'>${access_level}</a>`;
                if (plan.link == 'NA') {
                    access_link = '<a href="https://servius.tech/contact">Contact Us</a>';
                }

                var contractors = plan.contractor;
                contractors = contractors.replace(" ", "");
                contractors = contractors.replace(",", "<br>");

                let card = document.createElement("div");
                card.className = "plan-card";
                card.innerHTML = `
                    <table>
                        <tr>
                            <td class="name-col">${plan.name}</td>
                            <td class="contractor-col">${contractors}</td>
                            <td class="bid-col">${plan.bid_date}</td>
                            <td class="version-col">${plan.version}</td>
	   		                <td class="preview-col">${preview_link}</td>
                            <td class="access-col">${access_link}</td>
                        </tr>
                    </table>
                    <a class="order-button" href="/order?id=${plan.id}&cat=${category}">Order<br>Plans</a>
                `;

                board.appendChild(card);
            }

            if (plans.length == 0) {
                no_projects_card = document.createElement("div");
                no_projects_card.style = "width: 100%; text-align: center;";
                no_projects_card.innerText = "No current projects";

                board.appendChild(no_projects_card);
            }
        }

        function retrieve_plans() {
            var cat_name = undefined;
            if (category == -1) {
                cat_name = "All";
            }
            else {
                cat_name = categories[category];
            }
            
            // Fetch plans
            let config = {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "mode": "same-origin",
                }
            }

            fetch(`/get-projects?category=${cat_name}`, config)
            .then((response) => response.json())
            .then((res) => {
                let data = res;
                plans = data.plans;
                sort_data();
                populate_list();
            })
        }

        function set_active_tab() {
            for (let i = 0; i < tabs.length; i++) {
                if (tabs[i].id == category) {
                    tabs[i].className = "tab active";
                }
                else {
                    tabs[i].className = "tab";
                }
            }
        }

        function set_active_field_tab() {
            for (let i = 0; i < field_labels.length; i++) {
                if (field_labels[i].id == sort_field) {
                    field_labels[i].innerHTML = field_label_names[field_labels[i].id] + " &Congruent;";
                    field_labels[i].style = "text-decoration: underline;";
                }
                else {
                    field_labels[i].innerHTML = field_label_names[field_labels[i].id];
                    field_labels[i].style = "text-decoration: none;";
                }
            }
        }

        function sort_data() {
            plans = plans.sort((a, b) => {
                let string1 = a[sort_field];
                let string2 = b[sort_field];

                if (sort_field == "bid_date"){
                    // Handle dates
                    var date1 = new Date(string1);
                    var date2 = new Date(string2);

                    if (date1.toString() == "Invalid Date") {
                        date1 = new Date(0);
                    }

                    if (date2.toString() == "Invalid Date") {
                        date2 = new Date(0);
                    }
 
                    let year_dif = date1.getFullYear() - date2.getFullYear();
                    if (year_dif != 0)
                        return sort_flip ? year_dif : -year_dif;

                    let month_dif = date1.getMonth() - date2.getMonth();
                    if (month_dif != 0)
                        return sort_flip ? month_dif : -month_dif;

                    let day_dif = date1.getDate() - date2.getDate();
                    return sort_flip ? day_dif: -day_dif;
                }

                if (string1 < string2 ) {
                    return sort_flip ? 1 : -1;
                }
                else if (string1 > string2) {
                    return sort_flip ? -1 : 1;
                }

                return 0;
            });
        }

        for (let i = 0; i < field_labels.length; i++) {
            field_labels[i].addEventListener("click", (e) => {
                e.preventDefault();


                if (e.target.id == sort_field) {
                    sort_flip = !sort_flip;
                }
                else {
                    sort_flip = false;
                }

                sort_field = e.target.id;

                set_active_field_tab();

                sort_data();
                populate_list();
            })
        }

        let config = {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
				"mode": "same-origin",
			},
        };
        fetch("/categories", config)
        .then((response) => response.json())
        .then((res) => {
            for (cat_index in res.categories) {
                categories.push(res.categories[cat_index]);

                let tab = document.createElement("a");
                tab.href = "#";
                tab.className = "tab";
                tab.id = cat_index;
                tab.innerText = res.categories[cat_index];

                tab.addEventListener("click", (e) => {
                    e.preventDefault();

                    category = e.target.id;
                    set_active_tab();
                    retrieve_plans();
                });

                tab_bar.appendChild(tab);

                tabs.push(tab);
            }
            set_active_tab();
            retrieve_plans();
            set_active_field_tab();

        })
    </script>
</html>
