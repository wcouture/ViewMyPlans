<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ViewMyPlans — Order Plans</title>
        <link href="/css/page-style.css" rel="stylesheet"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="icon" type="image/jpg" href="/images/logo.jpg">
        <link href="https://fonts.googleapis.com/css2?family=Freeman&family=Satisfy&display=swap" rel="stylesheet">
    </head>
    <body>
        <a class="back-to-plans" href="/plans">Back</a>
        <div class="title-bar">Plan Order Form</div>
        <div class="plan-board">
            <p class="project-name-label" id="project-name">Project: PROJECT_NAME</p>
            <div class="order-form-row">
                <label for="email">Email:</label>
                <input type="email" placeholder="user@email.com" id="email" required>
                <input type="submit" id="submit-button" value="SUBMIT">
            </div>
            <textarea class="order-notes" id="notes-textarea" placeholder="Additional details/notes..."></textarea>

            <h2 id="full-header" class="order-header">Full Set</h2>
            <div class="order-columns" id="full-list">
                <div id="plan-column-full"></div>
                <div id="spec-column-full"></div>
            </div>

            <h2 id="section-header" class="order-header">Section</h2>
            <div class="order-columns" id="section-list">
                <div class="order-column-scroll" id="plan-column-sec"></div>
                <div class="order-column-scroll" id="spec-column-div"></div>
            </div>

            <h2 id="individual-header" class="order-header">Individual</h2>
            <div class="order-columns" id="individual-list">
                <div class="order-column-scroll order-column-scroll--tall" id="plan-column-ind"></div>
                <div class="order-column-scroll order-column-scroll--tall" id="spec-column-ind"></div>
            </div>
        </div>

        <script src="/js/order.js"></script>
    </body>
</html>
