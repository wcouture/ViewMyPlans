<!DOCTYPE html>
<html>
    <head>
        <title>ViewMyPlans</title>
        <link href="/css/page-style.css" rel="stylesheet"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="icon" type="image/jpg" href="/images/logo.jpg">
        <link href="https://fonts.googleapis.com/css2?family=Freeman&family=Satisfy&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="title-bar">Plan Order Form</div>
        <div class="plan-board">
            <p style="width: 100%; text-align: center;" id="project-name">Project: PROJECT_NAME</p>
            <h2 class="order-header">Full Set</h2>
            <div id="full-list"></div>
            <h2 class="order-header">Section</h2>
            <div id="section-list"></div>
            <h2 class="order-header">Individual</h2>
            <div style="display: flex;" id="individual-list">
                <div style="margin-left: auto; margin-right: auto; width: auto; max-height: 300px; overflow-y: auto;" id="plan-column-ind"></div>
                <div style="margin-left: auto; margin-right: auto; width: auto; max-height: 300px; overflow-y: auto;" id="spec-column-ind"></div>
            </div>
        </div>
    </body>
    <script>
        var project_data = undefined;
        let full = document.getElementById("full-list");
        let section = document.getElementById("section-list");
        let plan_ind = document.getElementById("plan-column-ind");
        let spec_ind = document.getElementById("spec-column-ind");

        function set_project_data(data) {
            project_data = data;
		var header = document.createElement("p");
		header.innerText = "~~~~~~~~~~ Plans ~~~~~~~~~~";

            plan_ind.appendChild(header);
            var i = 0;
            for (; i < project_data.plan_ind.length; i++) {
                let item = document.createElement("p");
                item.innerText = project_data.plan_ind[i];
                plan_ind.appendChild(item);
            }

		header = document.createElement("p");
		header.innerText = "~~~~~~~~~~ Specs ~~~~~~~~~~";
            spec_ind.appendChild(header);


            i = 0;
            for (; i < project_data.spec_ind.length; i++) {
                let item = document.createElement("p");
                item.innerText = project_data.spec_ind[i];
                spec_ind.appendChild(item);
            }
        }
    </script>
